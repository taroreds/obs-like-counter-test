<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Like Goal Test</title>
  <style>
    :root {
      --box-left: 4vw;
      --box-top: 7vh;
      --box-width: 42vw;

      --bg-color: rgba(0, 0, 0, 0.68);
      --border-color: rgba(255, 255, 255, 0.45);
      --text-color: #ffffff;
      --subtext-color: rgba(255, 255, 255, 0.86);
      --accent-color: #7dd3fc;
      --bar-bg: rgba(255, 255, 255, 0.18);

      --radius: 1.2vw;
    }

    body {
      margin: 0;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-color);
      overflow: hidden;
    }

    .widget {
      position: absolute;
      width: var(--box-width);
      max-width: 86vw;
      box-sizing: border-box;

      padding: 2vh 2vw;
      border-radius: var(--radius);
      background: var(--bg-color);
      border: 2px solid var(--border-color);

      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    .pos-top-left .widget {
      left: 4vw;
      top: 7vh;
    }

    .pos-top-right .widget {
      right: 4vw;
      top: 7vh;
    }

    .pos-bottom-left .widget {
      left: 4vw;
      bottom: 7vh;
    }

    .pos-bottom-right .widget {
     right: 4vw;
     bottom: 7vh;
    }


    .label {
      font-size: clamp(20px, 1.6vw, 30px);
      font-weight: 700;
      color: var(--subtext-color);
      letter-spacing: 0.04em;
      overflow-wrap: anywhere;
    }

    .main {
      margin-top: 0.8vh;
      display: flex;
      align-items: baseline;
      gap: 0.8vw;
      overflow-wrap: anywhere;
    }

    .current {
      font-size: clamp(44px, 4.8vw, 86px);
      font-weight: 800;
      line-height: 1;
      color: var(--accent-color);
    }

    .goal {
      font-size: clamp(22px, 2vw, 34px);
      font-weight: 700;
      color: var(--subtext-color);
    }

    .bar {
      margin-top: 1.6vh;
      width: 100%;
      height: clamp(14px, 1.4vw, 24px);
      border-radius: 999px;
      background: var(--bar-bg);
      overflow: hidden;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: var(--accent-color);
      transition: width 0.3s ease;
    }

    .message {
      margin-top: 1vh;
      font-size: clamp(18px, 1.4vw, 26px);
      font-weight: 600;
      color: var(--subtext-color);
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body class="pos-bottom-right">
  <div class="widget">
    <div class="label" id="label"></div>

    <div class="main">
      <div class="current" id="current"></div>
      <div class="goal" id="goal"></div>
    </div>

    <div class="bar">
      <div class="bar-fill" id="barFill"></div>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    const settings = {
      label: "とても長い高評価ゴール表示テスト用ラベルです。長い説明文が入った場合でも表示枠から大きくはみ出さず、OBS上で読み取れるかを確認しています。",
      current: 42,
      goal: 0,
      message: "とてもとても長い説明文が入った場合でも表示枠から大きくはみ出さず、OBS上で読み取れるかを確認しています。"
      };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function safeNumber(value, fallback) {
      const num = Number(value);
      return Number.isFinite(num) ? num : fallback;
    }

    function render() {
      const label = String(settings.label || "高評価ゴール");
      const message = String(settings.message || "");

      const current = Math.max(0, safeNumber(settings.current, 0));
      const goal = Math.max(1, safeNumber(settings.goal, 1));

      const percent = clamp((current / goal) * 100, 0, 100);

      document.getElementById("label").textContent = label;
      document.getElementById("current").textContent = current.toLocaleString();
      document.getElementById("goal").textContent = `/ ${goal.toLocaleString()}`;
      document.getElementById("barFill").style.width = `${percent}%`;
      document.getElementById("message").textContent = message;
    }

    render();
  </script>
</body>
</html>
