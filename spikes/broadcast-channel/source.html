<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BroadcastChannel 診断 - source</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      background: transparent;
      color: #ffffff;
    }

    .panel {
      position: absolute;
      top: 5vh;
      left: 3vw;
      width: min(680px, 92vw);
      box-sizing: border-box;
      padding: 20px;
      border: 1px solid rgba(125, 211, 252, 0.65);
      border-radius: 12px;
      background: rgba(8, 15, 27, 0.88);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 1.7vw, 30px);
    }

    .description {
      margin: 8px 0 16px;
      color: #dbeafe;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      margin-bottom: 16px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(125, 211, 252, 0.2);
      color: #bae6fd;
      font-weight: 700;
    }

    dl {
      display: grid;
      grid-template-columns: minmax(120px, 32%) 1fr;
      gap: 8px 12px;
      margin: 0;
    }

    dt {
      color: #bae6fd;
      font-weight: 700;
    }

    dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    button {
      width: 100%;
      margin: 18px 0 14px;
      padding: 12px 16px;
      border: 1px solid rgba(125, 211, 252, 0.75);
      border-radius: 8px;
      background: #0c4a6e;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .log {
      max-height: 250px;
      margin: 0;
      padding: 12px;
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.28);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="panel" aria-live="polite">
    <h1>BroadcastChannel 診断（source）</h1>
    <p class="description">OBSのBrowser Sourceとして読み込み、dockとの双方向通信を確認します。</p>
    <div class="status" id="connectionStatus">初期化中</div>

    <dl>
      <dt>ページの役割</dt><dd>source</dd>
      <dt>location.href</dt><dd id="href"></dd>
      <dt>location.origin</dt><dd id="origin"></dd>
      <dt>location.protocol</dt><dd id="protocol"></dd>
      <dt>navigator.userAgent</dt><dd id="userAgent"></dd>
      <dt>BroadcastChannel対応</dt><dd id="support"></dd>
      <dt>インスタンスID</dt><dd id="instanceId"></dd>
      <dt>送信件数</dt><dd id="sentCount">0</dd>
      <dt>受信件数</dt><dd id="receivedCount">0</dd>
      <dt>最後に送信したメッセージ</dt><dd id="lastSent">未送信</dd>
      <dt>最後に受信したメッセージ</dt><dd id="lastReceived">未受信</dd>
    </dl>

    <button type="button" id="pingButton">PINGを送信</button>

    <h2>通信ログ</h2>
    <pre class="log" id="log" aria-label="時刻付き通信ログ"></pre>
  </main>

  <script>
    (() => {
      "use strict";

      const ROLE = "source";
      const CHANNEL_NAME = "obs-like-goal-broadcast-spike-v1";
      const instanceId = createInstanceId();
      let channel = null;
      let sentCount = 0;
      let receivedCount = 0;

      const elements = {
        connectionStatus: document.getElementById("connectionStatus"),
        href: document.getElementById("href"),
        origin: document.getElementById("origin"),
        protocol: document.getElementById("protocol"),
        userAgent: document.getElementById("userAgent"),
        support: document.getElementById("support"),
        instanceId: document.getElementById("instanceId"),
        sentCount: document.getElementById("sentCount"),
        receivedCount: document.getElementById("receivedCount"),
        lastSent: document.getElementById("lastSent"),
        lastReceived: document.getElementById("lastReceived"),
        pingButton: document.getElementById("pingButton"),
        log: document.getElementById("log")
      };

      function createInstanceId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }

        return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
      }

      function formatMessage(value) {
        try {
          return JSON.stringify(value);
        } catch (error) {
          return String(value);
        }
      }

      function appendLog(message) {
        const timestamp = new Date().toISOString();
        elements.log.textContent += `[${timestamp}] ${message}\n`;
        elements.log.scrollTop = elements.log.scrollHeight;
      }

      function recordError(message, error) {
        const detail = error ? `${message}: ${error.message || String(error)}` : message;
        appendLog(`エラー: ${detail}`);
        console.error(detail, error || "");
      }

      function updateConnectionStatus(text, enabled) {
        elements.connectionStatus.textContent = text;
        elements.pingButton.disabled = !enabled;
      }

      function updateEnvironment() {
        elements.href.textContent = location.href;
        elements.origin.textContent = location.origin;
        elements.protocol.textContent = location.protocol;
        elements.userAgent.textContent = navigator.userAgent;
        elements.support.textContent = typeof window.BroadcastChannel === "function"
          ? "対応"
          : "未対応";
        elements.instanceId.textContent = instanceId;
      }

      function sendMessage(message) {
        if (!channel) {
          recordError("チャンネルが利用できないため送信できません");
          return false;
        }

        try {
          channel.postMessage(message);
          sentCount += 1;
          elements.sentCount.textContent = String(sentCount);
          elements.lastSent.textContent = formatMessage(message);
          appendLog(`送信: ${formatMessage(message)}`);
          return true;
        } catch (error) {
          recordError("postMessageに失敗しました", error);
          return false;
        }
      }

      function handleMessage(event) {
        const message = event.data;
        receivedCount += 1;
        elements.receivedCount.textContent = String(receivedCount);
        elements.lastReceived.textContent = formatMessage(message);
        appendLog(`受信: ${formatMessage(message)}`);

        if (!message || typeof message !== "object" || Array.isArray(message)) {
          appendLog("受信データがオブジェクトではないため返信しません。");
          return;
        }

        if (message.kind === "ping" && typeof message.instanceId === "string") {
          sendMessage({
            kind: "pong",
            from: ROLE,
            instanceId,
            replyTo: message.instanceId,
            sentAt: new Date().toISOString()
          });
        }
      }

      function initializeChannel() {
        if (typeof window.BroadcastChannel !== "function") {
          updateConnectionStatus("未接続：BroadcastChannel未対応", false);
          recordError("BroadcastChannelが未定義です");
          return;
        }

        try {
          channel = new BroadcastChannel(CHANNEL_NAME);
          channel.addEventListener("message", handleMessage);
          updateConnectionStatus(`チャンネル準備完了：${CHANNEL_NAME}`, true);
          appendLog(`チャンネルを生成しました: ${CHANNEL_NAME}`);
          sendMessage({
            kind: "hello",
            from: ROLE,
            instanceId,
            sentAt: new Date().toISOString(),
            href: location.href,
            origin: location.origin
          });
        } catch (error) {
          channel = null;
          updateConnectionStatus("未接続：チャンネル生成失敗", false);
          recordError("BroadcastChannelの生成に失敗しました", error);
        }
      }

      elements.pingButton.addEventListener("click", () => {
        sendMessage({
          kind: "ping",
          from: ROLE,
          instanceId,
          sentAt: new Date().toISOString()
        });
      });

      window.addEventListener("beforeunload", () => {
        if (channel) {
          channel.close();
        }
      });

      updateEnvironment();
      initializeChannel();
    })();
  </script>
</body>
</html>
