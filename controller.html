<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高評価ゴール操作パネル</title>
  <link rel="stylesheet" href="./controller.css">
</head>

<body>
  <main class="controller">
    <header class="controller-header">
      <h1>高評価ゴール操作</h1>
      <p>表示ページと同期して操作します。</p>
    </header>

    <section class="sync-panel" aria-labelledby="syncTitle">
      <h2 id="syncTitle">同期状態</h2>
      <output class="sync-status status-waiting" id="syncStatus">同期待機</output>
      <p class="sync-description" id="syncDescription">表示ページからの状態を待っています。</p>
      <p class="sync-time">最終同期: <time id="lastSync">未同期</time></p>
      <button type="button" id="resyncButton">再同期</button>
    </section>

    <section class="values" aria-labelledby="valuesTitle">
      <h2 id="valuesTitle">現在の値</h2>
      <dl>
        <div>
          <dt>現在値</dt>
          <dd id="currentValue">—</dd>
        </div>
        <div>
          <dt>目標値</dt>
          <dd id="goalValue">—</dd>
        </div>
      </dl>
    </section>

    <section aria-labelledby="adjustTitle">
      <h2 id="adjustTitle">増減</h2>
      <div class="adjust-grid">
        <button type="button" data-requires-sync data-action="decrement" data-amount="10">-10</button>
        <button type="button" data-requires-sync data-action="decrement" data-amount="1">-1</button>
        <button type="button" data-requires-sync data-action="increment" data-amount="1">+1</button>
        <button type="button" data-requires-sync data-action="increment" data-amount="10">+10</button>
      </div>
    </section>

    <section aria-labelledby="setTitle">
      <h2 id="setTitle">直接設定</h2>
      <form class="set-form" novalidate>
        <label for="currentInput">現在値</label>
        <div class="input-row">
          <input id="currentInput" data-requires-sync inputmode="decimal" type="text" autocomplete="off">
          <button type="button" data-requires-sync id="setCurrentButton">設定</button>
        </div>

        <label for="goalInput">目標値</label>
        <div class="input-row">
          <input id="goalInput" data-requires-sync inputmode="decimal" type="text" autocomplete="off">
          <button type="button" data-requires-sync id="setGoalButton">設定</button>
        </div>
      </form>
    </section>

    <section class="reset-actions" aria-labelledby="resetTitle">
      <h2 id="resetTitle">リセット</h2>
      <button type="button" data-requires-sync id="resetCounterButton">カウンターを0に戻す</button>
      <button type="button" data-requires-sync class="danger" id="resetAllButton">初期設定に戻す</button>
    </section>

    <p class="result" id="result" role="status">同期済みになるまで操作できません。</p>
    <p class="notice">OBSでは、Browser Sourceとカスタムブラウザドックの両方に同じ配布フォルダ内のfile URLを指定してください。</p>
  </main>

  <script src="./transport.js"></script>
  <script src="./controller.js"></script>
</body>
</html>
