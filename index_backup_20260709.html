<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>OBS Test</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: sans-serif;
      color: white;
      overflow: hidden;
    }

.box {
  position: absolute;
  left: 4vw;
  top: 7vh;

  width: 42vw;
  max-width: 86vw;
  box-sizing: border-box;

  padding: 2vh 2vw;
  border-radius: 1.2vw;
  background: rgba(0, 0, 0, 0.65);

  color: white;
  font-size: clamp(28px, 2.5vw, 48px);
  font-weight: 700;
  line-height: 1.3;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);

  overflow-wrap: anywhere;
}

.small {
  display: block;
  margin-top: 0.8vh;
  font-size: clamp(18px, 1.6vw, 28px);
  font-weight: 500;
  opacity: 0.9;
  overflow-wrap: anywhere;
}




  </style>
</head>
<body>
<div class="box">
  OBS表示テスト<br>
  <span class="small">とても長い配信者名と、とても長い企画タイトルと、とても長い説明文が入った場合の表示テストです。Like Goal 100000000 / 現在 999999999999999999</span>
</div>
</body>
</html>
